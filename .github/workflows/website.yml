# Validate Cloudflare Pages build; do not deploy to GitHub Pages.
name: website-build
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "launch/claims.yaml"
      - "launch/glossary.yaml"
      - "launch/citation.bib"
      - "launch/cases/flagship.yaml"
      - "demo/cases/flagship/**"
      - "results/reports/two_scenario_three_model_baseline_comparison_20260723.csv"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "launch/**"
      - "demo/cases/flagship/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: python3 launch/tools/check_claims.py
      - name: Confirm live site canonical URL
        run: |
          grep -F 'https://sparseread.pages.dev/' website/dist/index.html
          grep -F 'https://sparseread.pages.dev/' website/dist/robots.txt
